<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Sheet Data</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
    }

    th {
      background: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>Sheet data</h1>
  <p id="status">Loading…</p>
  <table id="dataTable" hidden></table>

  <script>
    const spreadsheetId = "1q0nhh4t9E_ljPT82IozjkXh_T5UplTsUfFS6n1XOjnk";
    const apiKey = "AIzaSyDmC34mAylKsOrQ5-R3hZnoEPmtxbLedks";
    const sheetName = "Palkki 5 Näyttö Tue 24.11.";
    const range = encodeURIComponent(`'${sheetName}'!A1:E30`);

    const url =
      `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}` +
      `/values/${range}?key=${apiKey}`;

    fetch(url)
      .then(async response => {
        if (!response.ok) {
          const details = await response.text();
          throw new Error(`Google Sheets returned HTTP ${response.status}: ${details}`);
        }

        return response.json();
      })
      .then(data => {
        const rows = data.values ?? [];
        const table = document.getElementById("dataTable");

        table.replaceChildren();

        if (rows.length === 0) {
          document.getElementById("status").textContent =
            "No values found in A4:E30.";
          return;
        }

        for (const row of rows) {
          const tr = table.insertRow();

          for (const value of row) {
            tr.insertCell().textContent = value;
          }
        }

        table.hidden = false;
        document.getElementById("status").textContent = "";
      })
      .catch(error => {
        document.getElementById("status").textContent = error.message;
        console.error(error);
      });
  </script>
</body>
</html>
